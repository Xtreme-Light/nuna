[package]
name = "nuna"
version = "0.1.1"
edition = "2024"

[dependencies]
log = "0.4.8"
anyhow = "1"
simplelog = "0.12.0"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.21.2"
crossbeam-channel = "0.5.15"
image = { version = "0.25", default-features = false, features = ["ico"] }
tao = "0.34"
single-instance = "0.3.3"  # 用于单实例检查

# v0.1.1 起移除 kanata-interception（Interception 内核驱动）：
# 改用 WH_KEYBOARD_LL 低级键盘钩子拦截事件，无需安装驱动、无需管理员权限，
# 也从根源上消除其打包的 mouse.sys 过滤驱动导致 USB 鼠标热插拔后失灵的问题。

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
