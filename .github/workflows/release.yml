name: Windows Build and Release

# 触发条件：
# 1. 推送 v* 标签：构建并自动创建 GitHub Release（推荐的发版方式）
# 2. 在 GitHub 页面上手动创建 Release：构建并把产物挂到该 Release
# 3. 推送 master（非文档改动）：仅构建，产物放在 Actions Artifacts
on:
  release:
    types: [created]
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'  # 忽略所有Markdown文件的修改
      - 'docs/**'  # 忽略docs目录下的修改
    tags:
      - 'v*'  # 推送 v 开头的标签触发发版

# 必要的权限配置
permissions:
  contents: write  # 允许上传构建产物

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      zip-name: ${{ steps.package.outputs.zip-name }}  # 输出zip文件名供后续步骤使用
    permissions: write-all

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc  # Windows x64目标

      - name: 构建Release版本
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 准备打包文件
        shell: pwsh
        run: |
          # 创建临时打包目录
          New-Item -ItemType Directory -Path release_dir | Out-Null

          # 复制可执行文件
          # v0.1.1 起改用 WH_KEYBOARD_LL 低级键盘钩子：不再依赖 interception.dll，
          # 无需安装任何驱动，exe 单文件即可运行
          $exePath = "target/x86_64-pc-windows-msvc/release/nuna.exe"
          Copy-Item -Path $exePath -Destination "release_dir/"

          # 附带 Interception 过滤器清理工具（给 v0.1.0 老用户善后用）
          $scriptPath = "script/cleanup-interception.ps1"
          if (Test-Path $scriptPath) {
              New-Item -ItemType Directory -Path "release_dir/script" -Force | Out-Null
              Copy-Item -Path "script/cleanup-interception.ps1", "script/cleanup-interception.bat" -Destination "release_dir/script/"
          } else {
              Write-Error "未找到 $scriptPath，无法打包"
              exit 1
          }

      - name: 打包为zip并输出文件名
        id: package
        shell: pwsh
        run: |
          # 根据触发条件生成不同的文件名（标签/Release 用版本号，普通推送用提交哈希）
          $isTagOrRelease = "${{ github.ref }}".StartsWith("refs/tags/")
          if ($isTagOrRelease) {
              $version = "${{ github.ref_name }}"
              $zipName = "nuna-windows-x64-$version.zip"
          } else {
              $commitHash = "${{ github.sha }}".Substring(0, 8)
              $zipName = "nuna-windows-x64-$commitHash.zip"
          }
          # 执行打包
          Compress-Archive -Path "release_dir/*" -DestinationPath $zipName -Force
          
          # 再次验证文件存在
          if (-not (Test-Path $zipName)) {
              Write-Error "打包失败，未生成 $zipName"
              exit 1
          }
          
          # 关键修复：正确使用正确的PowerShell语法输出环境变量
          echo "zip-name=$zipName" >> $env:GITHUB_OUTPUT
          
          # 调试输出
          Write-Host "生成的ZIP文件: $zipName"
          Write-Host "输出变量: $(Get-Content $env:GITHUB_OUTPUT)"

      - name: 临时保存ZIP文件
        uses: actions/upload-artifact@v4
        with:
          name: temp-build-zip  # 临时工件名称
          path: ${{ steps.package.outputs.zip-name }}
          retention-days: 1  # 临时保存1天


  # 标签推送或手动创建Release时：上传到GitHub Releases
  upload-release:
    needs: build-windows
    # 推送 v* 标签（不存在同名Release时自动创建）或手动创建Release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: 下载临时ZIP文件
        uses: actions/download-artifact@v5
        with:
          name: temp-build-zip

      - name: 上传到GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nuna ${{ github.ref_name }}
          body: |
            CapsLock 增强小工具（Windows）。

            ## 🎉 本版本（v0.1.1）：彻底移除 Interception 驱动依赖

            **v0.1.1 起无需安装任何驱动、无需管理员权限，解压运行 nuna.exe 即可。**
            输入拦截改用 Windows 低级键盘钩子（WH_KEYBOARD_LL，实现参考 kanata 的 LLHOOK 后端），
            键位映射行为与 v0.1.0 完全一致。

            ### 修复的问题

            v0.1.0 打包的 Interception 驱动安装器（install-interception /install）会默认把
            keyboard 和 mouse 两个内核过滤驱动都写入系统，而其中的 mouse.sys 过滤驱动存在缺陷：
            **USB 鼠标被拔插（设备重新枚举）后，它会吞掉鼠标输入事件**。症状：

            - 设备管理器里鼠标一切正常；
            - 鼠标与接收器配对正常；
            - 但光标完全不动，触摸板正常，换 USB 口也无效；
            - 日志里可见接收器频繁"意外删除"后重新枚举。

            v0.1.1 不再安装任何过滤器，从根源上消除该问题。详见 README「v0.1.1 重要变更」一节。

            ### ⚠️ 从 v0.1.0 升级的用户必做

            如果装过 v0.1.0（跑过 install-interception /install），请运行 zip 内附带的清理工具
            把残留的过滤器从注册表裁掉，否则鼠标失灵问题仍会复现：

            - **双击 `script\cleanup-interception.bat`**：自动请求管理员权限，移除鼠标侧 mouse 过滤器（清理后重启电脑，或重新插拔一次鼠标接收器）；
            - v0.1.1 用户推荐彻底清理（键盘侧过滤器也一并移除）：
              `powershell -ExecutionPolicy Bypass -File script\cleanup-interception.ps1 -RemoveKeyboardToo`
            - 工具会自动备份注册表，双击备份的 .reg 文件即可还原；
            - 也可以用 v0.1.0 附带的 install-interception.exe /uninstall 彻底卸载驱动本体。

            ### zip 内容

            - nuna.exe —— 主程序（免驱动，双击即用，托盘退出）
            - script\cleanup-interception.ps1 / .bat —— Interception 过滤器清理工具
          generate_release_notes: true
          files: ${{ needs.build-windows.outputs.zip-name }}
          draft: false
          prerelease: false

  # master分支变动时：上传到Actions工件
  upload-artifact:
    needs: build-windows
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')  # 仅普通分支推送
    runs-on: windows-latest
    steps:
      - name: 显示构建产物名称（调试用）
        run: |
          echo "需要上传的文件: ${{ needs.build-windows.outputs.zip-name }}"
        shell: pwsh

      # 新增步骤：下载临时工件（获取build-windows生成的ZIP）
      - name: 下载临时ZIP文件
        uses: actions/download-artifact@v5
        with:
          name: temp-build-zip  # 与上传时的名称一致

      - name: 验证文件存在性
        shell: pwsh
        run: |
          $zipName = "${{ needs.build-windows.outputs.zip-name }}"
          if ([string]::IsNullOrEmpty($zipName)) {
              Write-Error "zip-name为空，无法继续"
              exit 1
          }
          if (-not (Test-Path $zipName)) {
              Write-Error "文件 $zipName 不存在"
              exit 1
          }


      - name: 上传构建产物到工件
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: ${{ needs.build-windows.outputs.zip-name }}
          retention-days: 7  # 保留7天
